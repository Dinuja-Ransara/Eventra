<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details — Eventara</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body,
        html {
            background-color: #0d1117 !important;
            color: #fff !important;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .event-banner {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .event-banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #0d1117 90%);
            height: 200px;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            max-width: 1100px;
            margin: -60px auto 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 800px) {
            .details-layout {
                grid-template-columns: 1fr;
            }
        }

        .ticket-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            position: sticky;
            top: 20px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .form-input:focus {
            border-color: #58a6ff;
        }
    </style>
</head>

<body>
    <!-- Minimal Nav -->
    <nav class="nav"
        style="background: rgba(13,17,23,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #30363d;">
        <div class="container nav-inner">
            <a href="index.html" class="logo"><span
                    class="bars"><span></span><span></span><span></span><span></span></span>Eventara</a>
        </div>
    </nav>

    <div id="loading-state" style="text-align: center; padding: 100px; color: #8b949e;">Loading event details...</div>
    <div id="event-content" style="display: none;">
        <!-- Banner injected here -->
    </div>

    <script>
        lucide.createIcons();
        let currentEvent = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('id');

            if (!eventId) {
                alert("Event not found!");
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                currentEvent = events.find(e => e.id == eventId);

                if (!currentEvent) {
                    document.getElementById("loading-state").innerText = "Event not found or has been removed.";
                    return;
                }

                renderEventDetails(currentEvent);
            } catch (err) {
                console.error(err);
                document.getElementById("loading-state").innerText = "Failed to load event data.";
            }
        });

        function renderEventDetails(ev) {
            document.getElementById("loading-state").style.display = "none";
            const contentDiv = document.getElementById("event-content");
            contentDiv.style.display = "block";

            const imgSrc = ev.imagePath ? `sources/${ev.imagePath}` : 'aluth-kalawak-poster.jpg';
            const description = ev.description || "No description provided for this event.";

            // Parse Ticket Tiers (e.g., "General: LKR 2000 | VIP: LKR 5000")
            const rawTickets = ev.ticketInfo || "General: LKR 2000";
            const tiers = rawTickets.split("|").map(t => t.trim());
            let tierOptions = tiers.map(t => `<option value="${t}">${t}</option>`).join('');

            contentDiv.innerHTML = `
        <div class="event-banner" style="background-image: url('${imgSrc}');">
          <div class="event-banner-overlay"></div>
        </div>

        <div class="details-layout">
          <!-- Left: Event Info -->
          <div>
            <span style="font-size: 12px; background: rgba(56,189,248,0.1); color: #38bdf8; padding: 4px 10px; border-radius: 12px; font-weight: 700; text-transform: uppercase;">
              ${ev.category || 'Event'}
            </span>
            <h1 style="font-size: 42px; margin: 12px 0; color: #fff;">${ev.title}</h1>
            
            <div style="display: flex; gap: 20px; color: #8b949e; margin-bottom: 30px; font-size: 15px;">
              <div style="display: flex; align-items: center; gap: 6px;"><i data-lucide="calendar" style="width:18px;"></i> ${ev.eventDate || 'TBA'}</div>
              <div style="display: flex; align-items: center; gap: 6px;"><i data-lucide="map-pin" style="width:18px;"></i> ${ev.venue || 'TBA'}</div>
            </div>

            <h3 style="color: #fff; margin-bottom: 12px;">About this event</h3>
            <p style="color: #c9d1d9; line-height: 1.6; font-size: 15px; white-space: pre-wrap;">${description}</p>
          </div>

          <!-- Right: Checkout Card -->
          <div>
            <div class="ticket-card">
              <h3 style="margin-top: 0; color: #fff;">Secure Your Tickets</h3>
              <p style="color: #8b949e; font-size: 13px; margin-bottom: 20px;">Select your preferred package below.</p>
              
              <label style="font-size: 12px; color: #8b949e; font-weight: 600; text-transform: uppercase;">Ticket Package</label>
              <select id="selected-tier" class="form-input" style="margin-top: 6px;">
                ${tierOptions}
              </select>

              <label style="font-size: 12px; color: #8b949e; font-weight: 600; text-transform: uppercase;">Quantity</label>
              <input type="number" id="ticket-qty" class="form-input" style="margin-top: 6px;" min="1" max="10" value="1">

              <button onclick="processMockCheckout()" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 14px; background: linear-gradient(90deg, #9333ea, #db2777); border: none; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; font-size: 16px;">
                Buy Tickets Now
              </button>
            </div>
          </div>
        </div>
      `;
            lucide.createIcons();
        }

        function processMockCheckout() {
            // 1. Require user to be logged in
            const isLoggedIn = sessionStorage.getItem("isLoggedIn");
            if (isLoggedIn !== "true") {
                alert("Please log in to purchase tickets.");
                window.location.href = "login.html";
                return;
            }

            const tier = document.getElementById("selected-tier").value;
            const qty = parseInt(document.getElementById("ticket-qty").value);

            if (qty < 1) {
                alert("Please select at least 1 ticket.");
                return;
            }

            // 2. Generate tickets and save to sessionStorage
            const existingBookings = JSON.parse(sessionStorage.getItem("userBookings") || "[]");

            for (let i = 0; i < qty; i++) {
                const ticketCode = 'EVT-' + Math.floor(1000 + Math.random() * 9000) + '-LK';
                existingBookings.push({
                    eventId: currentEvent.id,
                    eventTitle: currentEvent.title,
                    date: currentEvent.eventDate,
                    venue: currentEvent.venue,
                    tier: tier,
                    code: ticketCode
                });
            }

            sessionStorage.setItem("userBookings", JSON.stringify(existingBookings));

            // 3. Mock success alert and redirect to dashboard
            alert(`Payment Successful!\n\nYou have secured ${qty} ticket(s) for ${currentEvent.title}.\nYour passes and QR codes have been added to your profile.`);
            window.location.href = "user-profile.html";
        }
    </script>
</body>

</html>
