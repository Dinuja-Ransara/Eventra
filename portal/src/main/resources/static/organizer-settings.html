<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Eventara Organizer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dash-shell">
        <aside class="dash-sidebar">
            <a href="index.html" class="logo"><span
                    class="bars"><span></span><span></span><span></span><span></span></span>Eventara</a>
            <nav class="dash-nav">
                <a href="dashboard.html"><i data-lucide="layout-dashboard" style="width:17px;height:17px"></i>
                    Overview</a>
                <a href="organizer-events.html"><i data-lucide="calendar" style="width:17px;height:17px"></i> My
                    Events</a>
                <a href="create-event.html"><i data-lucide="plus-circle" style="width:17px;height:17px"></i> Create
                    Event</a>
                <a href="organizer-orders.html"><i data-lucide="ticket" style="width:17px;height:17px"></i> Orders</a>
                <a href="organizer-attendees.html"><i data-lucide="users" style="width:17px;height:17px"></i>
                    Attendees</a>
                <span class="section-label">Grow</span>
                <a href="organizer-marketing.html"><i data-lucide="megaphone" style="width:17px;height:17px"></i>
                    Marketing</a>
                <a href="organizer-sponsors.html"><i data-lucide="handshake" style="width:17px;height:17px"></i>
                    Sponsors</a>
                <span class="section-label">Account</span>
                <a href="organizer-settings.html" class="active"><i data-lucide="settings"
                        style="width:17px;height:17px"></i> Settings</a>
                <a href="index.html"><i data-lucide="log-out" style="width:17px;height:17px"></i> Sign out</a>
            </nav>
        </aside>
        <main class="dash-main">
            <div class="dash-topbar">
                <div>
                    <h1>Organizer Settings ⚙️</h1>
                    <p style="color:var(--text-dim);font-size:14px;margin-top:4px">Update your organizer profile and
                        payout configurations.</p>
                </div>
            </div>
            <div class="glass panel" style="width:100%; max-width:600px;">
                <form onsubmit="event.preventDefault(); alert('Organizer settings saved!');">
                    <div style="margin-bottom:15px;">
                        <label style="font-size:13px; color:var(--text-dim);">Organization Name</label>
                        <input type="text" value="NFORCE Club"
                            style="width:100%; padding:10px; background:#161b22; border:1px solid #30363d; border-radius:6px; color:#fff; margin-top:5px;" />
                    </div>
                    <div style="margin-bottom:15px;">
                        <label style="font-size:13px; color:var(--text-dim);">Contact Phone</label>
                        <input type="text" value="+94 77 000 0000"
                            style="width:100%; padding:10px; background:#161b22; border:1px solid #30363d; border-radius:6px; color:#fff; margin-top:5px;" />
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
