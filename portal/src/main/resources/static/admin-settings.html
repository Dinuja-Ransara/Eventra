<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Eventara Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="dash-shell">
        <aside class="dash-sidebar">
            <a href="index.html" class="logo"><span
                    class="bars"><span></span><span></span><span></span><span></span></span>Eventara Admin</a>
            <nav class="dash-nav">
                <a href="admin-dashboard.html"><i data-lucide="shield-check" style="width:17px;height:17px"></i>
                    Overview</a>
                <a href="admin-organizers.html"><i data-lucide="users" style="width:17px;height:17px"></i> Manage
                    Organizers</a>
                <a href="admin-reports.html"><i data-lucide="file-text" style="width:17px;height:17px"></i> System
                    Reports</a>
                <a href="admin-events.html"><i data-lucide="calendar" style="width:17px;height:17px"></i> All Events</a>
                <span class="section-label">Platform Control</span>
                <a href="admin-settings.html" class="active"><i data-lucide="settings"
                        style="width:17px;height:17px"></i> Settings</a>
                <a href="index.html"><i data-lucide="log-out" style="width:17px;height:17px"></i> Exit dashboard</a>
            </nav>
        </aside>
        <main class="dash-main">
            <div class="dash-topbar">
                <div>
                    <h1>Admin Settings ⚙️</h1>
                    <p style="color:var(--text-dim);font-size:14px;margin-top:4px">Configure platform-wide preferences
                        and security credentials.</p>
                </div>
            </div>
            <div class="glass panel" style="width:100%; margin-top:20px; max-width:600px;">
                <div class="panel-head">
                    <h3>Security Credentials</h3>
                </div>
                <form onsubmit="event.preventDefault(); alert('Settings updated successfully!');">
                    <div class="form-group" style="margin-bottom:15px;">
                        <label style="font-size:13px; color:var(--text-dim);">Admin Email</label>
                        <input type="email" value="admin@eventara.com"
                            style="width:100%; padding:10px; background:#161b22; border:1px solid #30363d; border-radius:6px; color:#fff;" />
                    </div>
                    <div class="form-group" style="margin-bottom:20px;">
                        <label style="font-size:13px; color:var(--text-dim);">New Password</label>
                        <input type="password" placeholder="••••••••"
                            style="width:100%; padding:10px; background:#161b22; border:1px solid #30363d; border-radius:6px; color:#fff;" />
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                </form>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
