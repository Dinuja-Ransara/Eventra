<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events — Eventara Organizer</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .dash-shell {
            display: flex;
            min-height: 100vh;
            background-color: var(--bg-base);
        }

        .dash-main {
            flex: 1;
            padding: 24px 30px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            box-sizing: border-box;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="dash-shell">
        <aside class="dash-sidebar">
            <a href="index.html" class="logo"><span
                    class="bars"><span></span><span></span><span></span><span></span></span>Eventara</a>
            <nav class="dash-nav">
                <a href="dashboard.html"><i data-lucide="layout-dashboard" style="width:17px;height:17px"></i>
                    Overview</a>
                <a href="organizer-events.html" class="active"><i data-lucide="calendar"
                        style="width:17px;height:17px"></i> My Events</a>
                <a href="create-event.html"><i data-lucide="plus-circle" style="width:17px;height:17px"></i> Create
                    Event</a>
                <a href="organizer-orders.html"><i data-lucide="ticket" style="width:17px;height:17px"></i> Orders</a>
                <a href="organizer-attendees.html"><i data-lucide="users" style="width:17px;height:17px"></i>
                    Attendees</a>
                <span class="section-label">Account</span>
                <a href="index.html" id="logout-link"><i data-lucide="log-out" style="width:17px;height:17px"></i> Sign
                    out</a>
            </nav>
        </aside>

        <main class="dash-main">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <div>
                    <h1 style="margin:0; font-size:22px; color:#fff;">My Events 📅</h1>
                    <p style="margin:4px 0 0 0; font-size:13px; color:var(--text-dim);">Manage your published events and
                        track approval statuses.</p>
                </div>
                <a href="create-event.html" class="btn btn-primary btn-sm">+ New Event</a>
            </div>

            <div class="glass panel" style="width:100%; border:1px solid #30363d; border-radius:12px; overflow:hidden;">
                <table style="width:100%; text-align:left; border-collapse:collapse;">
                    <thead>
                        <tr style="border-bottom:1px solid #30363d; background:rgba(22,27,34,0.5);">
                            <th style="padding:16px; font-size:11px; color:var(--text-dim); text-transform:uppercase;">
                                Event Name</th>
                            <th style="padding:16px; font-size:11px; color:var(--text-dim); text-transform:uppercase;">
                                Date</th>
                            <th style="padding:16px; font-size:11px; color:var(--text-dim); text-transform:uppercase;">
                                Venue</th>
                            <th style="padding:16px; font-size:11px; color:var(--text-dim); text-transform:uppercase;">
                                Status</th>
                            <th style="padding:16px; font-size:11px; color:var(--text-dim); text-transform:uppercase;">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="organizer-events-tbody">
                        <tr>
                            <td colspan="5" style="text-align:center; padding:24px; color:var(--text-dim);">Loading your
                                events...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit Event Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="margin:0; font-size:18px; color:#fff;">Edit Event</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:#8b949e; cursor:pointer;"><i
                        data-lucide="x"></i></button>
            </div>
            <form id="edit-event-form">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-existing-image">

                <label style="font-size:12px; color:#8b949e;">Event Title</label>
                <input type="text" id="edit-title" class="form-input" required>

                <label style="font-size:12px; color:#8b949e;">Category</label>
                <select id="edit-category" class="form-input">
                    <option value="Music">Music</option>
                    <option value="Tech">Tech</option>
                    <option value="Food">Food</option>
                    <option value="Art">Art</option>
                    <option value="Business">Business</option>
                    <option value="Sports">Sports</option>
                </select>

                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label style="font-size:12px; color:#8b949e;">Venue</label>
                        <input type="text" id="edit-venue" class="form-input" required>
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px; color:#8b949e;">Date</label>
                        <input type="date" id="edit-date" class="form-input" required>
                    </div>
                </div>

                <label style="font-size:12px; color:#8b949e;">Ticket Price Tiers</label>
                <input type="text" id="edit-price" class="form-input" required>

                <label style="font-size:12px; color:#8b949e;">Cover Image (Leave blank to keep current)</label>
                <input type="file" id="edit-image" accept="image/*" class="form-input" style="cursor: pointer;">

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // FIX: Read safely from sessionStorage to keep multiple tabs independent
        const userEmail = sessionStorage.getItem("userEmail") || "org@eventara.com";

        document.addEventListener("DOMContentLoaded", () => {
            fetchOrganizerEvents();

            const logoutLink = document.getElementById("logout-link");
            if (logoutLink) {
                logoutLink.addEventListener("click", (e) => {
                    e.preventDefault();
                    sessionStorage.clear(); // Clears storage ONLY for this specific tab
                    window.location.href = "index.html";
                });
            }

            // Handle Edit Submission
            document.getElementById("edit-event-form").addEventListener("submit", async (e) => {
                e.preventDefault();

                const imageInput = document.getElementById("edit-image");
                let finalImagePath = document.getElementById("edit-existing-image").value;

                if (imageInput.files && imageInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("file", imageInput.files[0]);
                    try {
                        const uploadRes = await fetch('/api/events/upload', { method: 'POST', body: formData });
                        if (uploadRes.ok) {
                            finalImagePath = await uploadRes.text();
                        }
                    } catch (err) {
                        console.error("Image upload error:", err);
                    }
                }

                const eventId = document.getElementById("edit-id").value;
                const updatedData = {
                    title: document.getElementById("edit-title").value,
                    category: document.getElementById("edit-category").value,
                    venue: document.getElementById("edit-venue").value,
                    eventDate: document.getElementById("edit-date").value,
                    ticketPrice: document.getElementById("edit-price").value,
                    description: "Updated description via Organizer Panel",
                    imageUrl: finalImagePath,
                    organizerEmail: userEmail
                };

                try {
                    const response = await fetch(`/api/events/${eventId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedData)
                    });
                    if (response.ok) {
                        closeModal();
                        fetchOrganizerEvents();
                    } else {
                        alert("Failed to update event.");
                    }
                } catch (err) {
                    console.error("Error updating event:", err);
                }
            });
        });

        async function fetchOrganizerEvents() {
            const tbody = document.getElementById("organizer-events-tbody");
            if (!tbody) return;

            try {
                const response = await fetch(`/api/events/organizer/${userEmail}`);
                if (!response.ok) throw new Error("Failed to fetch");

                const events = await response.json();

                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-dim);">You have not published any events yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = "";
                events.forEach(event => {
                    const tr = document.createElement("tr");
                    tr.style.borderBottom = "1px solid #30363d";

                    const isApproved = event.status === "APPROVED";

                    tr.innerHTML = `
            <td style="padding: 16px;">
              <strong style="color:#fff;">${event.title}</strong><br>
              <span style="font-size:12px; color:var(--text-dim);">${event.category}</span>
            </td>
            <td style="padding: 16px; color:#c9d1d9; font-size: 14px;">${event.eventDate}</td>
            <td style="padding: 16px; color:#c9d1d9; font-size: 14px;">${event.venue}</td>
            <td style="padding: 16px;">
              <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 20px; background: ${isApproved ? 'rgba(52, 211, 153, 0.1)' : 'rgba(251, 191, 36, 0.1)'}; color: ${isApproved ? '#34d399' : '#fbbf24'};">
                ${event.status || 'PENDING'}
              </span>
            </td>
            <td style="padding: 16px;">
              <button class="btn btn-ghost btn-sm" onclick='openEditModal(${JSON.stringify(event)})' style="padding:6px 12px; margin-right:6px; border-radius: 20px;">Edit</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteEvent(${event.id})" style="padding:6px 12px; color:var(--pink); border-radius: 20px; border: 1px solid rgba(244, 63, 94, 0.2);">Delete</button>
            </td>
          `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading events:", err);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--pink);">Failed to connect to database.</td></tr>';
            }
        }

        function openEditModal(eventData) {
            document.getElementById("edit-id").value = eventData.id;
            document.getElementById("edit-title").value = eventData.title;
            document.getElementById("edit-category").value = eventData.category;
            document.getElementById("edit-venue").value = eventData.venue;
            document.getElementById("edit-date").value = eventData.eventDate;
            document.getElementById("edit-price").value = eventData.ticketPrice;
            document.getElementById("edit-existing-image").value = eventData.imageUrl || "";
            document.getElementById("edit-image").value = "";

            document.getElementById("edit-modal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("edit-modal").classList.remove("active");
        }

        async function deleteEvent(id) {
            if (confirm("Are you sure you want to delete this event?")) {
                try {
                    const response = await fetch(`/api/events/${id}`, { method: 'DELETE' });
                    if (response.ok) fetchOrganizerEvents();
                } catch (err) { console.error("Error deleting event:", err); }
            }
        }
    </script>
</body>

</html>
